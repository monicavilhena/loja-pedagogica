<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiara Ensina</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">


    <div class="logo">
        <h2>Kiara Ensina</h2>
    </div>

    <ul class="menu">
        <li><a href="#inicio">Início</a></li>
        <li><a href="#categorias">Categorias</a></li>
        <li><a href="#produtos">Produtos</a></li>
        <li><a href="#contato">Contato</a></li>
    </ul>

</nav>


</header>

<main>


<!-- HERO -->
<section id="inicio" class="hero">

    <div class="hero-texto">

        <h1>
            Aprender pode ser divertido!
        </h1>

        <p>
            Materiais pedagógicos criados para professores,
            estudantes e famílias.
        </p>

        <a href="#produtos" class="botao">
            Ver Produtos
        </a>

    </div>

<div class="hero-imagem">

    <img
        src="imagens/hero.jpg"
        alt="Materiais pedagógicos">

</div>

</section>

<!-- PRODUTOS -->
<section id="produtos" class="produtos">

    <div class="titulo-secao">

        <h2>Materiais em Destaque</h2>

        <p>
            Conheça alguns dos nossos materiais digitais.
        </p>

    </div>

    <div class="pesquisa">

        <input
            type="text"
            id="pesquisar"
            placeholder="🔍 Pesquise um material...">

    </div>

    <div class="produtos-grid" id="lista-produtos">
    </div>

</section>


</main>

<footer id="contato">
   <p>© 2026 Kiara Ensina</p>
</footer>

<script src="js/script.js"></script>

<script src="js/produtos.js"></script>

</body>
</html>
