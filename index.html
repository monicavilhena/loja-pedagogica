<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedagocão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🐶 Pedagocão</h1>
        <p>Materiais pedagógicos para professores</p>
    </header>

    <main class="produtos">

        <div class="produto">
            <img src="https://via.placeholder.com/300x200" alt="Material 1">
            <h2>Alfabeto Ilustrado</h2>
            <p>PDF com atividades de alfabetização.</p>
            <span>R$ 9,90</span>
            <button onclick="comprar('Alfabeto Ilustrado')">Comprar</button>
        </div>

        <div class="produto">
            <img src="https://via.placeholder.com/300x200" alt="Material 2">
            <h2>Matemática Divertida</h2>
            <p>Atividades de soma e subtração.</p>
            <span>R$ 12,90</span>
            <button onclick="comprar('Matemática Divertida')">Comprar</button>
        </div>

        <div class="produto">
            <img src="https://via.placeholder.com/300x200" alt="Material 3">
            <h2>Coordenação Motora</h2>
            <p>20 páginas para imprimir.</p>
            <span>R$ 14,90</span>
            <button onclick="comprar('Coordenação Motora')">Comprar</button>
        </div>

    </main>

    <footer>
        <p>© 2026 Pedagocão</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
